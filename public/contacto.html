<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto | Nuevo Sitio</title>
  <meta name="description" content="Ponte en contacto con nosotros." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">Nuevo Sitio</a>
      <nav class="nav">
        <a href="index.html">Inicio</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="servicios.html">Servicios</a>
        <a href="contacto.html" aria-current="page">Contacto</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Contacto</h1>
        <p>Escríbenos y te respondemos a la brevedad.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <form action="#" method="post">
          <div class="form-field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required />
          </div>
          <div class="form-field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-field">
            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn">Enviar</button>
        </form>
        <p style="margin-top:2rem;color:var(--color-muted)">
          O escríbenos a <a href="mailto:hola@ejemplo.com">hola@ejemplo.com</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Nuevo Sitio. Todos los derechos reservados.</p>
    </div>
  </footer>
</body>
</html>
